<div class="gift-wrap" (click)="giftClicked.emit(true)">
  <app-icon [icon]="checkType" [hover]="null" [ngClass]="[checkType, claimedByUser]" [title]="checkboxTitle">
  </app-icon>
  <span class="gift-name-box">
    <span class="gift-name">{{gift.name}}</span>
    <app-icon *ngIf="gift.isMostWanted" icon="star" [hover]="null" [fill]="1" title="Most Wanted"></app-icon>
  </span>
</div>
