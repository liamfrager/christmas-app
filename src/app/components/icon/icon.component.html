<span *ngIf="hover" class="material-symbols-outlined icon" [class.filled]="fill === 1" (click)="handleClick($event)" [style.fontSize]="size">{{icon}}</span>
<span *ngIf="hover === false" class="material-symbols-outlined" [class.filled]="fill === 1" (click)="handleClick($event)" [style.fontSize]="size">{{icon}}</span>
<span *ngIf="hover === null" class="material-symbols-outlined" [class.filled]="fill === 1" [style.fontSize]="size">{{icon}}</span>
